<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PharmaQuest: Walk the Pharma Building</title>
<style>
:root{--bg:color-mix(in srgb,#2BB3A7 9%,#F8F8F5);--ink:#0F5D5A;--panel:#F8F8F5;--line:color-mix(in srgb,#2BB3A7 35%,#F8F8F5);--acc:#0F5D5A;--accInk:#F8F8F5;--amber:#F6B44D;--bad:#B8760F;--good:#2BB3A7;--mute:color-mix(in srgb,#0F5D5A 75%,#F8F8F5);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:color-mix(in srgb,#0F5D5A 35%,#000);--ink:#F8F8F5;--panel:color-mix(in srgb,#0F5D5A 70%,#000);--line:color-mix(in srgb,#2BB3A7 40%,#0F5D5A);--acc:#2BB3A7;--accInk:color-mix(in srgb,#0F5D5A 50%,#000);--amber:#F6B44D;--bad:#F6B44D;--good:#2BB3A7;--mute:color-mix(in srgb,#F8F8F5 70%,#0F5D5A)}}
:root[data-theme="dark"]{--bg:color-mix(in srgb,#0F5D5A 35%,#000);--ink:#F8F8F5;--panel:color-mix(in srgb,#0F5D5A 70%,#000);--line:color-mix(in srgb,#2BB3A7 40%,#0F5D5A);--acc:#2BB3A7;--accInk:color-mix(in srgb,#0F5D5A 50%,#000);--amber:#F6B44D;--bad:#F6B44D;--good:#2BB3A7;--mute:color-mix(in srgb,#F8F8F5 70%,#0F5D5A)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.hud{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .5s}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
h1{font:700 34px/1.1 Georgia,serif;margin:0 0 10px}h2{font:700 22px/1.25 Georgia,serif;margin:0 0 8px}p{margin:0 0 12px}ul{padding-left:20px;margin:0 0 12px}.mute{color:var(--mute)}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:12px 16px;text-align:left}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.go{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:700;text-align:center;width:100%}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--amber);color:#0a3b39;font-weight:700;font-size:14px}
.fb{border-left:5px solid var(--acc);padding:8px 12px;margin:12px 0;background:color-mix(in srgb,var(--acc) 10%,var(--panel));border-radius:0 10px 10px 0}
.bld{position:relative;border:3px solid var(--ink);border-radius:14px 14px 0 0;overflow:hidden;background:var(--panel);margin-bottom:14px}
.roof{height:34px;background:var(--acc);color:var(--accInk);text-align:center;font-weight:700;padding-top:3px}
.fl{display:grid;grid-template-columns:1fr 44px 1fr;height:95px;border-top:3px solid var(--ink)}
.rm{position:relative;border:0;border-radius:0;margin:0;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;font-size:13px;line-height:1.2;overflow:hidden}
.rm .sc{position:absolute;top:6px;right:6px;font-size:32px}.rm .ck{position:absolute;top:4px;left:6px;font-size:18px}
.rm.dn{box-shadow:inset 0 0 0 3px var(--good)}
.sh{background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px);display:flex;align-items:center;justify-content:center;font-weight:700}
.av{position:absolute;font-size:32px;transform:translate(-50%,-50%);transition:left .75s linear,top .75s linear;z-index:2;pointer-events:none}
.pic{width:46px;height:46px;border-radius:50%;display:block}.ban .pic{display:inline-block;width:84px;height:84px;vertical-align:middle}.av.walk{animation:bob .3s infinite}@keyframes bob{50%{margin-top:-6px}}
.ban{border-radius:14px;padding:14px;text-align:center;font-size:46px;margin-bottom:12px}
.arena{position:relative;height:300px;border-radius:14px;overflow:hidden;touch-action:none;user-select:none;margin:12px 0;border:3px solid var(--ink)}
.arena.no{animation:shk .3s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.arena.no,.pic{width:46px;height:46px;border-radius:50%;display:block}.ban .pic{display:inline-block;width:84px;height:84px;vertical-align:middle}.av.walk{animation:none}.av{transition:none}.bar i{transition:none}}
.ov{position:fixed;inset:0;background:rgba(10,59,57,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.ov .card{max-width:420px;margin:0}.xb{padding:2px 10px;margin-left:8px;text-align:center}.bkr{position:relative;width:110px;height:170px;margin:0 auto;border:3px solid #F8F8F5;border-top:none;border-radius:0 0 22px 22px;overflow:hidden;background:rgba(248,248,245,.08)}.band{position:absolute;left:0;right:0;background:rgba(246,180,77,.45);border-top:2px dashed #F6B44D;border-bottom:2px dashed #F6B44D}.liq{position:absolute;left:0;right:0;bottom:0;background:#2BB3A7;height:0}.cht{position:relative;display:flex;align-items:flex-end;gap:6px;height:190px;padding:0 10px}.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;background:none;border:0;padding:0;color:#F8F8F5;font-size:13px;text-align:center}.bf{width:100%;background:#2BB3A7;border-radius:6px 6px 0 0}.exp{position:absolute;left:10px;right:10px;bottom:65px;border-top:2px dashed #F6B44D;pointer-events:none}.exp span{position:absolute;right:0;top:-18px;font-size:12px;color:#F6B44D}.tbar{height:8px;margin:10px 10px 0;background:rgba(248,248,245,.2);border-radius:4px;overflow:hidden}.tbar i{display:block;height:100%;width:100%;background:#F6B44D}.pc{position:absolute;left:11%;right:11%;top:52px;height:190px;background:#F8F8F5;color:#0F5D5A;border-radius:18px;padding:16px;text-align:center;font-size:17px;touch-action:none;cursor:grab;display:flex;flex-direction:column;justify-content:center;gap:8px;box-shadow:0 6px 0 rgba(0,0,0,.25)}.pc .em{font-size:52px;line-height:1.1}.hint{position:absolute;bottom:10px;font-weight:700;font-size:15px;opacity:0;color:#F8F8F5;pointer-events:none}.row2{display:flex;gap:10px;margin-top:10px}.row2 button{flex:1;text-align:center}.deco{position:absolute;right:8px;top:6px;font-size:34px;opacity:.6;pointer-events:none}
.belt{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.08) 22px 24px);pointer-events:none}
.item{position:absolute;left:0;top:0;padding:6px 10px;border-radius:12px;background:#F8F8F5;color:#0F5D5A;border:2px solid #0F5D5A;font-size:14px;white-space:nowrap;text-align:center}
button.item{cursor:pointer}
#bk{position:absolute;bottom:6px;width:56px;text-align:center;font-size:42px;line-height:1}
.thermo{position:relative;height:200px;width:70px;margin:0 auto;border:3px solid #F8F8F5;border-radius:35px;overflow:hidden;background:#0a3b39}
.zone{position:absolute;left:0;right:0;bottom:35%;height:30%;background:rgba(246,180,77,.35)}
.mer{position:absolute;bottom:0;left:18px;right:18px;background:#2BB3A7;transition:height .2s}
.big{font:700 38px Georgia,serif;text-align:center;color:#F8F8F5}
</style></head>

function start(){A.innerHTML='<div class="card"><div class="ban" style="background:color-mix(in srgb,var(--acc) 30%,var(--panel))">🏢 <img class="pic" src="'+IMG+'" alt=""> 💊</div><h1>PharmaQuest</h1><p>You are a new pharmacist at PharmaCo. Take the elevator, walk into each of the 8 departments, and survive its real-time challenge.</p><p class="mute">3 hearts per level. More hearts left means more XP.</p><button class="go" id="b">Enter the building</button></div>';b.onclick=map}
function px(x){return x==="m"?"50%":x===0?"calc((100% - 44px)/4)":"calc(100% - (100% - 44px)/4)"}
function py(r){return(34+r*95+68)+"px"}
function map(){clearInterval(T);var h='<div class="card"><h2>PharmaCo building</h2><p class="mute">Tap a room. Your pharmacist takes the elevator and walks there.</p></div><div class="bld"><div class="roof">💊 PharmaCo</div>';
 function room(r,x){var k=L.findIndex(function(d){return d.r==r&&d.x==x}),d=L[k],dn=S.d.indexOf(k)>-1;
  return'<button class="rm'+(dn?" dn":"")+'" data-k="'+k+'" style="background:color-mix(in srgb,'+d.c+' 38%,var(--panel))"><span class="sc">'+d.de+'</span>'+(dn?'<span class="ck">✅</span>':'')+'<b>'+d.s+'</b></button>'}
 for(var r=0;r<4;r++)h+='<div class="fl">'+room(r,0)+'<div class="sh">'+FL[r]+'</div>'+room(r,1)+'</div>';
 A.innerHTML=h+'<div class="av" id="av" style="left:'+px(S.p.x)+';top:'+py(S.p.r)+'"><img class="pic" src="'+IMG+'" alt="Your pharmacist"></div></div>';
 A.querySelectorAll(".rm").forEach(function(x){x.onclick=function(){walk(+x.dataset.k)}})}
function walk(k){if(S.w)return;S.w=1;var d=L[k],av=document.getElementById("av"),a=S.p.x==="m"?0:800,b=S.p.r==d.r?0:900;av.classList.add("walk");av.style.left=px("m");
 setTimeout(function(){av.style.top=py(d.r)},a);setTimeout(function(){av.style.left=px(d.x)},a+b+(a+b?0:0));
 setTimeout(function(){S.p={r:d.r,x:d.x};S.w=0;brief(k)},a+b+850)}
function brief(i){var d=L[i];A.innerHTML='<div class="card"><div class="ban" style="background:'+d.bg+'">'+d.de+' '+d.ic+'</div><span class="tag">Floor '+FL[d.r]+'</span><h2 style="margin-top:10px">'+d.n+'</h2><p>Your job here:</p><ul>'+d.job.map(function(x){return"<li>"+x+"</li>"}).join("")+'</ul><button class="go" id="b">Start shift</button><button id="bb" style="width:100%;margin-top:10px;text-align:center">Back to the building</button></div>';b.onclick=function(){play(i)};document.getElementById("bb").onclick=map}
function ask(){PZ=1;var o=document.createElement("div");o.className="ov";o.innerHTML='<div class="card"><h2>Leave this level?</h2><p>Your progress in this level will be lost and the department stays incomplete.</p><button class="go" id="kp">Keep playing</button><button id="lv" style="width:100%;margin-top:10px;text-align:center">Leave level</button></div>';document.body.appendChild(o);kp.onclick=function(){PZ=0;o.remove()};lv.onclick=function(){PZ=0;o.remove();map()}}
function frame(i,inner){var d=L[i];A.innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="tag">'+d.s+'</span><span><span id="hp">'+hearts()+'</span><button id="bb" class="xb" aria-label="Leave level">✕</button></span></div><h2 style="margin-top:10px">'+d.p+'</h2>'+inner+'<div id="f" aria-live="polite"></div></div>';document.getElementById("bb").onclick=ask}
function hit(i){var hh=document.getElementById("hp");if(!hh||hp<=0)return;hp--;hh.textContent=hearts();var a=document.getElementById("ar");if(a){a.classList.remove("no");void a.offsetWidth;a.classList.add("no")}if(hp<=0){clearInterval(T);setTimeout(function(){lose(i)},500)}}
function lose(i){A.innerHTML='<div class="card"><h2>Out of hearts</h2><p>Every pharmacist learns from errors. Shake it off and go again.</p><button class="go" id="b">Retry level</button><button id="bb" style="width:100%;margin-top:10px;text-align:center">Back to the building</button></div>';b.onclick=function(){play(i)};document.getElementById("bb").onclick=map}
function win(i){if(hp<=0)return;clearInterval(T);var g=60+hp*20;S.xp+=g;if(S.d.indexOf(i)<0)S.d.push(i);hud();
 A.innerHTML='<div class="card"><h2>Level complete! +'+g+' XP</h2><p>'+L[i].e+'</p><button class="go" id="b">'+(S.d.length==L.length?"See my results":"Back to the building")+'</button></div>';b.onclick=S.d.length==L.length?end:map}
function play(i){hp=3;PZ=0;clearInterval(T);var d=L[i];d.t=="temp"?tp(i,d):d.t=="pour"?pour(i,d):d.t=="triage"?triage(i,d):arena(i,d)}
function triage(i,d){var K=[["🤕","Mild headache for a few hours, gone on its own",0,"Short, mild, and resolved: log it as non-serious."],["😮‍💨","Swollen lips and throat, difficulty breathing",1,"A life-threatening allergic reaction (anaphylaxis)."],["🤢","Mild nausea after the first dose",0,"Mild and common: record it."],["🏥","Fainted and was admitted to hospital overnight",1,"Hospitalization makes a report serious."],["😴","Slight drowsiness in the afternoon",0,"Mild and manageable."],["🟡","Yellow skin and eyes with dark urine",1,"Signs of liver injury, which can be life-threatening."],["👄","Dry mouth, no other complaints",0,"A mild, common side effect."],["💔","Chest pain, taken to the emergency room by ambulance",1,"A possible life-threatening heart event."],["🩹","Itchy rash on the arm, gone in two days",0,"Mild and short-lived."],["⚡","First-ever seizure after starting treatment",1,"A seizure is a medically serious event."],["🦽","Lasting weakness in both legs after treatment",1,"Persistent disability is a seriousness criterion."],["🥱","Tiredness on the first day only",0,"Mild and temporary."]],
 q=K.sort(function(){return Math.random()-.5}).slice(0,8),n=0,lock=0,x0=0,dx=0,dr=0;
 frame(i,'<div class="arena" id="ar" style="background:'+d.bg+'"><span class="deco">'+d.de+'</span><div id="nm" style="padding:12px 50px 0 14px;color:#F8F8F5;font-weight:700"></div><div class="pc" id="pc"></div><span class="hint" id="hm" style="left:12px">\u25C0 Mild</span><span class="hint" id="hs" style="right:12px;color:#F6B44D">Serious \u25B6</span></div><div class="row2"><button id="bm">\u25C0 Mild: log it</button><button class="go" id="bs" style="width:auto">Serious: escalate \u25B6</button></div><p class="mute" style="margin-top:10px;font-size:14px">Serious means death, life-threatening, hospitalization, lasting disability, or a birth defect.</p>');
 function show(){if(!document.getElementById("pc"))return;var k=q[n];pc.style.transition="none";pc.style.transform="";pc.innerHTML='<div class="em">'+k[0]+'</div><div>'+k[1]+'</div>';nm.textContent="Case "+(n+1)+" of 8";f.innerHTML="";hm.style.opacity=0;hs.style.opacity=0;void pc.offsetWidth;pc.style.transition="transform .25s";lock=0}
 function decide(s){if(lock||PZ)return;lock=1;var k=q[n],ok=(s==k[2]);pc.style.transform="translateX("+(s?420:-420)+"px) rotate("+(s?25:-25)+"deg)";
  f.innerHTML='<div class="fb"><b>'+(ok?"Correct. ":(k[2]?"This one is serious. ":"This one is mild. "))+'</b>'+k[3]+'</div>';if(!ok)hit(i);n++;
  if(n==8)setTimeout(function(){if(document.getElementById("pc"))win(i)},1400);else setTimeout(show,1400)}
 pc.onpointerdown=function(e){if(lock||PZ)return;dr=1;x0=e.clientX;pc.style.transition="none";pc.setPointerCapture(e.pointerId)};
 pc.onpointermove=function(e){if(!dr)return;dx=e.clientX-x0;pc.style.transform="translateX("+dx+"px) rotate("+dx/12+"deg)";hs.style.opacity=Math.max(0,dx/90);hm.style.opacity=Math.max(0,-dx/90)};
 pc.onpointerup=pc.onpointercancel=function(){if(!dr)return;dr=0;pc.style.transition="transform .25s";if(Math.abs(dx)>90)decide(dx>0?1:0);else{pc.style.transform="";hm.style.opacity=0;hs.style.opacity=0}dx=0};
 bm.onclick=function(){decide(0)};bs.onclick=function(){decide(1)};show()}
function signal(i,d){var n=0,tm=0,live=0,R=["liver injury","severe rash","heart palpitations","low platelets","allergic shock"],D="ABCDEF";
 frame(i,'<div class="arena" id="ar" style="background:'+d.bg+'"><span class="deco">'+d.de+'</span><div class="big" id="nm" style="font-size:18px;padding:12px 44px 4px 8px"></div><div class="cht" id="ch"></div><div class="tbar"><i id="tb"></i></div></div><p class="mute" id="c">0 of 5</p>');
 function rd(){if(!document.getElementById("ch"))return;f.innerHTML="";live=1;tm=8;tb.style.width="100%";var sp=Math.floor(Math.random()*6),h="";nm.textContent="Reports of "+R[n]+", this month";
  for(var k=0;k<6;k++){var v=k==sp?17+Math.floor(Math.random()*10):2+Math.floor(Math.random()*8);h+='<button class="col" data-k="'+k+'"><span>'+v+'</span><div class="bf" style="height:'+(v/30*130)+'px"></div><span>Drug '+D[k]+'</span></button>'}
  ch.innerHTML=h+'<div class="exp"><span>expected</span></div>';ch.dataset.sp=sp;
  ch.querySelectorAll(".col").forEach(function(b){b.onclick=function(){if(!live||PZ)return;live=0;var k=+b.dataset.k;
   if(k==sp){n++;c.textContent=n+" of 5";b.querySelector(".bf").style.background="#F6B44D";f.innerHTML='<div class="fb"><b>Signal found!</b> Drug '+D[k]+' is far above the expected level, so it goes to full evaluation.</div>';if(n==5)return win(i)}
   else{f.innerHTML='<div class="fb">Not a signal. The spike was Drug '+D[sp]+'.</div>';hit(i)}
   setTimeout(rd,1300)}})}
 rd();
 T=setInterval(function(){if(PZ||!live)return;tm-=0.1;tb.style.width=(tm/8*100)+"%";
  if(tm<=0){live=0;f.innerHTML='<div class="fb">Time is up. The spike was Drug '+D[+ch.dataset.sp]+'.</div>';hit(i);setTimeout(rd,1300)}},100)}
function pour(i,d){var n=0,lv=0,hold=0,lock=0,tg=0,N=["Active ingredient","Binder","Filler","Disintegrant","Lubricant"];
 frame(i,'<div class="arena" id="ar" style="background:'+d.bg+'"><span class="deco">'+d.de+'</span><div class="big" id="nm" style="font-size:19px;padding:12px 40px 8px 8px"></div><div class="bkr"><div class="band" id="bd"></div><div class="liq" id="lq"></div></div><div class="big" id="rd" style="font-size:28px;padding-top:8px">0 mg</div></div><button class="go" id="po" style="touch-action:none;user-select:none">Hold to pour</button><p class="mute" id="c" style="margin-top:10px">0 of 5</p>');
 function rs(){if(!document.getElementById("lq"))return;lv=0;lock=0;hold=0;tg=120+10*Math.floor(Math.random()*29);f.innerHTML="";lq.style.height="0";rd.textContent="0 mg";nm.textContent=N[n]+": "+tg+" mg (\u00B130)";bd.style.bottom=((tg-30)/5)+"%";bd.style.height="12%"}
 function stop(){if(!hold)return;hold=0;if(lv<=0)return;var mg=Math.round(lv*5);lock=1;
  if(Math.abs(mg-tg)<=30){n++;c.textContent=n+" of 5";f.innerHTML='<div class="fb"><b>Within range!</b> '+mg+' mg</div>';if(n==5)return win(i);setTimeout(rs,800)}
  else{f.innerHTML='<div class="fb">'+(mg<tg?"Too little":"Too much")+': '+mg+' mg. The target was '+tg+' mg.</div>';hit(i);setTimeout(rs,900)}}
 po.onpointerdown=function(e){e.preventDefault();if(!lock&&!PZ)hold=1};po.onpointerup=po.onpointerleave=po.onpointercancel=stop;po.oncontextmenu=function(e){e.preventDefault()};
 po.onkeydown=function(e){if((e.key==" "||e.key=="Enter")&&!e.repeat){e.preventDefault();if(!lock&&!PZ)hold=1}};po.onkeyup=function(e){if(e.key==" "||e.key=="Enter")stop()};
 rs();
 T=setInterval(function(){if(PZ||lock)return;if(hold){lv+=1.15;if(lv>=100){lv=100;hold=0;lock=1;f.innerHTML='<div class="fb">Overflow! Too much powder spilled.</div>';hit(i);setTimeout(rs,900)}lq.style.height=lv+"%";rd.textContent=Math.round(lv*5)+" mg"}},30)}
function arena(i,d){var C=d.t=="catch",n=0,sp=0,tk=0,its=[];
 frame(i,'<div class="arena" id="ar" style="background:'+d.bg+'"><span class="deco">'+d.de+'</span>'+(C?'<div id="bk">'+d.bk+'</div>':d.dir=="x"?'<div class="belt"></div>':'')+'</div><p class="mute" id="c">0 of '+d.goal+'</p>');
 var W=ar.clientWidth,H=ar.clientHeight,bx=W/2;
 function sb(){bk.style.left=(bx-28)+"px"}
 if(C){sb();ar.onpointermove=ar.onpointerdown=function(e){bx=Math.max(28,Math.min(W-28,e.clientX-ar.getBoundingClientRect().left));sb()}}
 function rm(o){o.el.remove();its.splice(its.indexOf(o),1)}
 function got(){n++;c.textContent=n+" of "+d.goal;if(n==d.goal)win(i)}
 function spawn(){var x=d.gen?d.gen():d.it[Math.floor(Math.random()*d.it.length)],e=document.createElement(C?"div":"button");e.className="item";e.textContent=x[0];ar.appendChild(e);
  var o={el:e,g:x[1],x:d.dir=="x"?-170:Math.random()*(W-170)+10,y:d.dir=="x"?(sp++%2?160:70):-40};its.push(o);
  if(!C)e.onpointerdown=function(){if(its.indexOf(o)<0)return;rm(o);if(o.g)got();else hit(i)}}
 T=setInterval(function(){if(PZ)return;tk++;if(tk%d.sp==1)spawn();
  its.slice().forEach(function(o){if(d.dir=="x")o.x+=3;else o.y+=d.v;o.el.style.transform="translate("+o.x+"px,"+o.y+"px)";
   var cx=o.x+o.el.offsetWidth/2;
   if(C&&o.y>H-82&&o.y<H-30&&Math.abs(cx-bx)<(o.el.offsetWidth/4+28)){rm(o);if(o.g)got();else hit(i)}
   else if(d.dir=="x"?o.x>W:o.y>H){rm(o);if(!C&&o.g)hit(i)}})},40)}
function tp(i,d){var t=5,tk=0;frame(i,'<div class="arena" id="ar" style="background:#0F5D5A;height:auto;padding:14px"><span class="deco">📦❄️</span><div class="thermo"><div class="zone"></div><div class="mer" id="m"></div></div><div class="big" id="t"></div><p style="text-align:center;color:#F8F8F5" id="tm">20 s left</p><button class="go" id="cl">❄️ Cool</button></div>');
 function draw(){m.style.height=Math.max(0,Math.min(100,(t+5)/20*100))+"%";document.getElementById("t").textContent=t.toFixed(1)+" °C"}
 cl.onclick=function(){t-=1.1;draw()};draw();
 T=setInterval(function(){if(PZ)return;tk++;t+=0.1+Math.random()*0.25+(Math.random()<.06?0.8:0);draw();tm.textContent=Math.max(0,20-Math.floor(tk/4))+" s left";
  if(t>8||t<2){f.innerHTML='<div class="fb">'+(t>8?"Too warm! Product at risk.":"Too cold! The stock froze.")+'</div>';t=5;hit(i)}
  else if(tk>=80)win(i)},250)}
function end(){var r=S.xp>=900?["🏆","Qualified Person"]:S.xp>=750?["🥈","Senior Pharmacist"]:["🥉","Trainee Pharmacist"];
 A.innerHTML='<div class="card"><div style="font-size:56px;text-align:center">'+r[0]+'</div><h1 style="text-align:center">'+r[1]+'</h1><p style="text-align:center">'+S.xp+' XP</p><p>The industry pharmacist ensures medicines are <b>safe, effective, and consistent</b>, applies GMP, GLP, and GDP, keeps documentation, investigates deviations, complaints, and recalls, works across teams, and drives audits and improvement.</p><button class="go" id="b">Play again</button></div>';b.onclick=init}
